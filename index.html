<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hartvigsen Llama Farm</title>
<meta name="description" content="Bryndalin Hartvigsen's resume as an interactive llama farm. Drive the farm truck from pasture to pasture.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#7cc6f2; --sky-bot:#dff3ff;
  --wood:#9a5b2e; --wood-dark:#6e3d1c; --wood-light:#c7854c;
  --card:#fff8ec; --card-edge:#e8d3b0; --ink:#2b1d12; --muted:#6b5643; --accent:#d9661f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:#7cc6f2;overflow:hidden;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;overflow:hidden;cursor:crosshair;
  background:linear-gradient(var(--sky-top),var(--sky-bot) 70%);transition:background 1s}
body.night #stage{--sky-top:#0b1533;--sky-bot:#34477e}
.para{position:absolute;left:0;right:0;background-repeat:repeat-x;pointer-events:none}
#world{position:absolute;left:0;top:0;width:9000px;height:640px;transform-origin:0 0;will-change:transform}
.pz{position:absolute;top:0;width:1000px;height:640px}
.pz svg{display:block;overflow:visible}
.pz.off *{animation-play-state:paused!important}
#night{position:absolute;inset:0;background:#1a2560;mix-blend-mode:multiply;opacity:0;transition:opacity 1s;pointer-events:none;z-index:5}
body.night #night{opacity:.62}
#stars{position:absolute;inset:0 0 50% 0;opacity:0;transition:opacity 1s;pointer-events:none;z-index:6}
body.night #stars{opacity:1}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 3s infinite ease-in-out}
@keyframes twinkle{50%{opacity:.15}}
#sun{position:absolute;top:26px;right:230px;width:70px;height:70px;border-radius:50%;background:#ffd54a;z-index:1;
  box-shadow:0 0 0 14px rgba(255,213,74,.35),0 0 70px 24px rgba(255,213,74,.4);transition:all 1s}
body.night #sun{background:#f4f1dc;box-shadow:inset -16px -5px 0 0 #cfc9a6,0 0 50px 8px rgba(244,241,220,.25);z-index:7}
.cloud{position:absolute;left:-220px;width:120px;height:40px;border-radius:40px;background:#fff;opacity:.92;z-index:1;
  animation:drift linear infinite;pointer-events:none}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:56px;height:56px;left:18px;top:-28px}
.cloud::after{width:42px;height:42px;left:62px;top:-18px}
@keyframes drift{to{transform:translateX(calc(100vw + 440px))}}

/* ---------- svg animation kit ---------- */
.hopper{transform-box:fill-box;transform-origin:50% 100%;cursor:pointer}
.hopper.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{40%{transform:translateY(-34px) rotate(-5deg)}}
.act{transform-box:fill-box;transform-origin:50% 100%}
.leg{transform-box:fill-box;transform-origin:50% 0}
.walk .leg.a{animation:swing .5s ease-in-out infinite}
.walk .leg.b{animation:swing .5s ease-in-out infinite reverse}
@keyframes swing{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.neck{transform-box:fill-box;transform-origin:25% 100%}
.tail{transform-box:fill-box;transform-origin:100% 20%;animation:wag 1.4s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(16deg)}}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 4s ease-in-out infinite}
@keyframes ear{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-18deg)}}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}97%{transform:scaleY(1)}}

.nodder .neck{animation:nod 2.6s ease-in-out infinite}
@keyframes nod{0%,55%,100%{transform:rotate(0)}70%{transform:rotate(12deg)}85%{transform:rotate(3deg)}}
.wave .neck{animation:wave 1.1s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.write .neck{animation:write 1.3s ease-in-out infinite}
@keyframes write{0%,100%{transform:rotate(0)}25%{transform:rotate(7deg)}50%{transform:rotate(2deg)}75%{transform:rotate(9deg)}}
.stamp .neck{animation:stamp 1.6s ease-in infinite}
@keyframes stamp{0%,55%,100%{transform:rotate(0)}68%{transform:rotate(30deg)}76%{transform:rotate(26deg)}}
.gavel .neck{animation:stamp 1.1s ease-in infinite}
.sleep{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.05)}}
.dance{animation:dance .8s ease-in-out infinite}
.dance .neck{animation:headbang .4s ease-in-out infinite alternate}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-7deg)}25%,75%{transform:translateY(-16px) rotate(0)}50%{transform:translateY(0) rotate(7deg)}}
@keyframes headbang{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.bounce{animation:bounce 1s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-18px)}}
.shock{animation:shock 6s ease-out infinite}
@keyframes shock{0%,80%,100%{transform:none}84%{transform:translateY(-26px) rotate(-8deg)}90%{transform:translateY(0) rotate(3deg)}}
.pace{animation:pace var(--dur,10s) linear infinite}
@keyframes pace{0%{transform:translateX(0) scaleX(1)}46%{transform:translateX(var(--d)) scaleX(1)}50%{transform:translateX(var(--d)) scaleX(-1)}96%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}

.rise{animation:rise 2s linear infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
.floaty{animation:floaty 3.2s ease-out infinite;opacity:0}
@keyframes floaty{0%{transform:translate(0,0) scale(.7);opacity:0}15%{opacity:1}100%{transform:translate(24px,-90px) scale(1.2);opacity:0}}
.smoke{transform-box:fill-box;transform-origin:center;animation:smoke 3s ease-out infinite;opacity:0}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:.8}100%{transform:translate(18px,-90px) scale(1.8);opacity:0}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .35s ease-in-out infinite alternate}
@keyframes flicker{from{transform:scale(.85,.9) skewX(-4deg)}to{transform:scale(1.05,1.12) skewX(4deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
.spin-slow{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:swayk 3s ease-in-out infinite}
@keyframes swayk{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.reveal{animation:reveal 9s steps(40) infinite}
@keyframes reveal{0%{transform:translateX(0)}75%,100%{transform:translateX(250px)}}
.toss{transform-box:fill-box;transform-origin:center;animation:toss 3.4s ease-in-out infinite}
@keyframes toss{0%,50%,100%{transform:none}65%{transform:translateY(-70px) rotate(200deg)}80%{transform:translateY(0) rotate(360deg)}}
.flipb{transform-box:fill-box;transform-origin:center;animation:flipb 2.4s ease-in-out infinite}
@keyframes flipb{0%,40%,100%{transform:none}55%{transform:translateY(-55px) rotate(180deg)}70%{transform:translateY(0) rotate(360deg)}}
.cc{animation:cc 4s linear infinite}
@keyframes cc{0%,100%{fill:#ff5fa2}33%{fill:#4fc3ff}66%{fill:#8be05a}}
.poof{transform-box:fill-box;transform-origin:center;animation:poof 6s ease-out infinite;opacity:0}
@keyframes poof{0%,78%{transform:scale(.2);opacity:0}82%{transform:scale(1.2);opacity:1}100%{transform:scale(1.7) translateY(-20px);opacity:0}}
.aplus{animation:aplus 1.6s infinite;opacity:0}
@keyframes aplus{0%,65%{opacity:0;transform:none}70%{opacity:1;transform:translateY(-6px)}95%{opacity:1}100%{opacity:0}}
.page{transform-box:fill-box;transform-origin:0 50%;animation:page 2.6s ease-in-out infinite}
@keyframes page{0%,50%{transform:scaleX(1)}80%,100%{transform:scaleX(-1)}}
.slide{animation:slide 4s ease-in-out infinite}
@keyframes slide{0%,60%,100%{transform:none}70%,85%{transform:translateY(-18px)}}
.toast{animation:toast 7s linear infinite}
@keyframes toast{0%{fill:#fff}50%{fill:#e8b871}80%{fill:#4a2c14}88%,100%{fill:#fff}}
.beam{transform-box:view-box;transform-origin:500px 300px;animation:beam 3s ease-in-out infinite alternate}
@keyframes beam{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.tile{animation:tile 1.2s steps(1) infinite}
@keyframes tile{50%{opacity:.25}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse .4s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.juggle{animation:juggle .9s cubic-bezier(.3,0,.7,1) infinite alternate}
@keyframes juggle{to{transform:translateY(-55px)}}
.chat{transform-box:fill-box;transform-origin:50% 100%;animation:chat 9s ease-in-out infinite;opacity:0}
@keyframes chat{0%,6%{opacity:0;transform:scale(.6)}10%,42%{opacity:1;transform:scale(1)}47%,100%{opacity:0;transform:scale(.8)}}
.bell{transform-box:fill-box;transform-origin:50% 0;animation:wave 1.4s ease-in-out infinite}
.blinky{animation:tile 1s steps(1) infinite}

/* ---------- truck ---------- */
#truck{position:absolute;left:0;top:0;width:180px;height:118px;pointer-events:none}
#truck .flip{width:100%;height:100%;transition:transform .2s}
#truck.left .flip{transform:scaleX(-1)}
#truck svg{display:block;overflow:visible}
#truck.moving .tbody{animation:rumble .18s linear infinite}
@keyframes rumble{50%{transform:translateY(-1.5px)}}
.wheel{transform-box:fill-box;transform-origin:center}
#truck .pear{transform-box:fill-box;transform-origin:50% 100%;transition:transform .3s}
#truck.moving .pear{transform:rotate(-55deg)}
#truck .scarf{transform-box:fill-box;transform-origin:100% 50%}
#truck.moving .scarf{animation:flutter .25s infinite alternate}
@keyframes flutter{to{transform:rotate(10deg) scaleX(1.15)}}
.honk{position:absolute;left:50%;top:-34px;transform:translateX(-50%) scale(0);font:700 22px 'Fredoka',sans-serif;color:#c0392b;
  background:#fff;border:3px solid #2b1d12;border-radius:14px;padding:2px 10px;white-space:nowrap;transition:transform .2s cubic-bezier(.4,1.8,.5,1)}
.honk.show{transform:translateX(-50%) scale(1)}
.puff{position:absolute;width:18px;height:18px;border-radius:50%;background:#e9e4dc;pointer-events:none;animation:puff .9s ease-out forwards}
@keyframes puff{from{transform:scale(.4);opacity:.85}to{transform:translate(-22px,-26px) scale(1.8);opacity:0}}
.dest{position:absolute;font-size:34px;transform:translate(-50%,-100%);pointer-events:none;animation:dest .9s ease-in-out infinite alternate}
@keyframes dest{to{transform:translate(-50%,-115%)}}

/* ---------- UI ---------- */
.ui{cursor:auto}
.say{position:absolute;z-index:40;transform:translate(-50%,-100%);background:#fff;border:2px solid #2b1d12;border-radius:14px;
  padding:5px 11px;font-weight:800;font-size:14px;white-space:nowrap;pointer-events:none;animation:sayin .25s cubic-bezier(.4,1.7,.5,1)}
.say::after{content:"";position:absolute;left:50%;bottom:-8px;width:11px;height:11px;background:#fff;border:2px solid #2b1d12;border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
@keyframes sayin{from{transform:translate(-50%,-80%) scale(.5);opacity:0}}

#card{position:absolute;top:16px;left:16px;z-index:30;width:clamp(300px,30vw,400px);max-height:calc(100% - 100px);display:flex;flex-direction:column;
  background:var(--card);border:4px solid var(--wood-dark);border-radius:20px;box-shadow:0 10px 0 rgba(0,0,0,.18);overflow:hidden;
  transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
#card.bump{animation:cardbump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes cardbump{from{transform:translateY(-14px) rotate(-1.5deg)}}
#cardHead{display:block;width:100%;text-align:left;border:0;cursor:pointer;padding:12px 44px 12px 16px;position:relative;
  background:linear-gradient(135deg,#ffe2b8,#fff3df);border-bottom:3px dashed var(--card-edge)}
#cardHead .brand{display:block;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
#cardHead .kicker{display:block;font-size:12.5px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
#cardHead h2{margin:2px 0 0;font:600 clamp(20px,2.2vw,25px)/1.15 'Fredoka',sans-serif}
#cardHead .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;
  border:2px solid var(--wood-dark);display:grid;place-items:center;font-size:13px;background:#fff;transition:transform .2s}
#card.collapsed .chev,#card.moving .chev{transform:translateY(-50%) rotate(-90deg)}
#cardBody{padding:14px 18px 16px;overflow:auto;-webkit-user-select:text;user-select:text}
#card.collapsed #cardBody,#card.moving #cardBody{display:none}
.entry{margin-bottom:14px}
.entry h3{margin:0;font:600 17px 'Fredoka',sans-serif}
.entry .meta{color:var(--muted);font-weight:800;font-size:13.5px;margin-top:2px}
.entry ul{margin:7px 0 0;padding:0;list-style:none}
.entry li{position:relative;padding-left:24px;margin:5px 0;line-height:1.45;font-size:15px}
.entry li::before{content:"🌾";position:absolute;left:0;top:0;font-size:14px}
.entry p{margin:6px 0;line-height:1.5;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{background:#ffe8c4;border:2px solid var(--card-edge);border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px}
.gpa{display:inline-flex;align-items:baseline;gap:6px;background:#2b1d12;color:#ffd54a;border-radius:12px;padding:5px 14px;font-family:'Fredoka',sans-serif}
.gpa b{font-size:26px}
.report{margin-top:12px;padding:9px 12px;border-radius:12px;background:#eaf6e2;border:2px dashed #9cc98a;font-size:14px;line-height:1.45}
.report b{color:#3d7a2a}
.nav{display:flex;gap:8px;margin-top:14px}
.nav button{flex:1;border:2px solid var(--wood-dark);background:#fff;border-radius:12px;padding:7px 8px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 2px 0 var(--wood-dark)}
.nav button:hover{background:#ffe8c4}
.nav button:active{transform:translateY(2px);box-shadow:none}
.nav button:disabled{opacity:.35;cursor:default}
#card a{color:#b0521a;font-weight:800}
kbd{font:800 12px 'Nunito';background:#fff;border:2px solid var(--card-edge);border-bottom-width:3px;border-radius:6px;padding:0 5px}

#topRight{position:absolute;top:14px;right:14px;z-index:31;display:flex;gap:8px;align-items:flex-start}
.round{width:44px;height:44px;border-radius:50%;border:3px solid var(--wood-dark);background:var(--card);font-size:20px;cursor:pointer;box-shadow:0 3px 0 var(--wood-dark)}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-dark)}
#mini{width:176px;border:3px solid var(--wood-dark);border-radius:14px;background:#f3e2bd;padding:4px 4px 2px;cursor:pointer;box-shadow:0 4px 0 var(--wood-dark);transition:transform .15s}
#mini:hover{transform:scale(1.04) rotate(-1deg)}
#mini svg{display:block;width:100%}
#mini .lbl{display:flex;justify-content:space-between;font:600 12px 'Fredoka',sans-serif;padding:1px 4px 2px;color:var(--ink)}

#controls{position:absolute;left:16px;bottom:14px;z-index:31;display:flex;gap:10px;align-items:center}
.pad{width:64px;height:58px;border-radius:16px;border:3px solid var(--wood-dark);background:var(--card);font-size:24px;cursor:pointer;
  box-shadow:0 4px 0 var(--wood-dark);touch-action:none}
.pad.on,.pad:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dark);background:#ffe0b0}
.pad.honkb{width:58px;border-radius:50%;background:#ffd54a}
#keys{position:absolute;right:16px;bottom:16px;z-index:31;font-size:12.5px;font-weight:800;color:#fff;background:rgba(43,29,18,.55);padding:6px 10px;border-radius:10px;line-height:1.7}
#keys kbd{color:var(--ink)}

/* map modal */
#mapModal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:rgba(30,18,8,.5);opacity:0;pointer-events:none;transition:opacity .25s}
#mapModal.open{opacity:1;pointer-events:auto}
.mapcard{width:min(720px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:#f3e2bd;border:5px solid var(--wood-dark);border-radius:22px;padding:14px 16px 16px;
  box-shadow:0 12px 0 rgba(0,0,0,.2);transform:scale(.92) rotate(-1deg);transition:transform .35s cubic-bezier(.3,1.5,.5,1);position:relative;
  background-image:radial-gradient(rgba(110,61,28,.08) 1px,transparent 1px);background-size:14px 14px}
#mapModal.open .mapcard{transform:none}
.mapcard h2{margin:0 0 2px;font:700 24px 'Fredoka',sans-serif}
.mapcard p{margin:0 0 8px;color:var(--muted);font-weight:700;font-size:14px}
.mapcard .close{position:absolute;top:10px;right:10px}
.mapcard svg{width:100%;display:block}
.stop{cursor:pointer}
.stop:hover circle.ring,.stop:focus circle.ring{stroke:#d9661f;stroke-width:6}
.stop:focus{outline:none}
.mk{transition:transform .1s linear}

@media (max-width:760px){
  body{overflow:hidden}
  #stage{bottom:auto;height:56dvh}
  #card{position:fixed;top:56dvh;left:0;right:0;bottom:0;width:auto;max-height:none;border-radius:20px 20px 0 0;border-bottom:0;box-shadow:0 -4px 0 rgba(0,0,0,.12)}
  #card.collapsed #cardBody{display:block}
  #card.moving #cardBody{display:none}
  #cardHead{padding:9px 44px 9px 14px}
  #cardHead .brand{display:none}
  #mini{width:120px}
  #mini .lbl{font-size:10.5px}
  #topRight{top:8px;right:8px}
  .round{width:38px;height:38px;font-size:17px}
  #controls{bottom:8px;left:8px;gap:6px}
  .pad{width:54px;height:48px;font-size:20px}
  .pad.honkb{width:48px}
  #keys{display:none}
  #sun{right:150px;width:44px;height:44px;top:14px}
}
@media (prefers-reduced-motion:reduce){
  .pz *{animation-duration:0s!important}
}
</style>
</head>
<body>
<div id="stage" aria-label="Llama farm. Drive the truck between pastures.">
  <div id="sun"></div>
  <div class="cloud" style="top:9%;animation-duration:80s;animation-delay:-10s"></div>
  <div class="cloud" style="top:19%;animation-duration:110s;animation-delay:-60s;scale:.7"></div>
  <div class="cloud" style="top:4%;animation-duration:140s;animation-delay:-95s"></div>
  <div class="para" id="mtn"></div>
  <div class="para" id="hills"></div>
  <div id="world"></div>
  <div id="night"></div>
  <div id="stars"></div>

  <div id="topRight" class="ui">
    <button class="round" id="nightBtn" aria-label="Toggle day and night">🌙</button>
    <button id="mini" aria-label="Open the farm map"><div class="lbl"><span>🗺️ Farm map</span><span id="visited">1/9</span></div><svg id="miniSvg" viewBox="0 0 600 430"></svg></button>
  </div>

  <div id="controls" class="ui">
    <button class="pad" id="leftBtn" aria-label="Drive left">◀</button>
    <button class="pad honkb" id="honkBtn" aria-label="Honk the horn">📯</button>
    <button class="pad" id="rightBtn" aria-label="Drive right">▶</button>
  </div>
  <div id="keys" class="ui"><kbd>←</kbd> <kbd>→</kbd> drive · <kbd>H</kbd> honk · <kbd>M</kbd> map<br>or click anywhere to drive there</div>
</div>

<section id="card" class="ui" aria-live="polite">
  <button id="cardHead" aria-expanded="true">
    <span class="brand">🦙 Bryndalin Hartvigsen's Llama Farm</span>
    <span class="kicker" id="kicker"></span>
    <h2 id="title"></h2>
    <span class="chev">▾</span>
  </button>
  <div id="cardBody"></div>
</section>

<div id="mapModal" role="dialog" aria-modal="true" aria-labelledby="mapTitle">
  <div class="mapcard">
    <button class="round close" id="mapClose" aria-label="Close map">✕</button>
    <h2 id="mapTitle">🗺️ Farm Map</h2>
    <p>Pick a pasture and the truck will drive you there.</p>
    <svg id="bigSvg" viewBox="0 0 600 430"></svg>
  </div>
</div>

<script>
/* =========================================================
   helpers
   ========================================================= */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shade(hex,amt){const n=parseInt(hex.slice(1),16);return '#'+[n>>16,(n>>8)&255,n&255].map(v=>clamp(Math.round(v+amt),0,255).toString(16).padStart(2,'0')).join('')}
function seeded(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const F=`font-family="Fredoka, sans-serif"`;

/* A llama. Feet land at (x,y). Accessories go in `head` (moves with the neck) or `body`. */
function llama(o){
  const s=o.s||.9, w=o.wool||'#f3e6cf', dk=shade(w,-38), lt=shade(w,28), st=shade(w,-80), sn=o.dark?shade(w,55):shade(w,-14);
  const tx=o.flip?o.x+55*s:o.x-55*s, ty=o.y-126*s+(o.lying?38*s:0);
  const hoof='#3b2a1d';
  const backLegs=o.lying?'':`<g class="leg b"><rect x="30" y="80" width="8" height="42" rx="4" fill="${dk}"/><rect x="29" y="118" width="10" height="6" rx="2" fill="${hoof}"/></g><g class="leg a"><rect x="68" y="80" width="8" height="42" rx="4" fill="${dk}"/><rect x="67" y="118" width="10" height="6" rx="2" fill="${hoof}"/></g>`;
  const frontLegs=o.lying?'':`<g class="leg a"><rect x="22" y="82" width="9" height="42" rx="4" fill="${w}" stroke="${st}" stroke-width="1.5"/><rect x="21" y="120" width="11" height="6" rx="2" fill="${hoof}"/></g><g class="leg b"><rect x="76" y="82" width="9" height="42" rx="4" fill="${w}" stroke="${st}" stroke-width="1.5"/><rect x="75" y="120" width="11" height="6" rx="2" fill="${hoof}"/></g>`;
  const eye=o.sleepy?`<path d="M92.5 16 Q96 20 99.5 16" fill="none" stroke="#1d130c" stroke-width="1.8" stroke-linecap="round"/>`
    :`<circle cx="96" cy="16" r="2.6" fill="#1d130c"/><circle cx="96.8" cy="15.2" r=".9" fill="#fff"/><rect class="lid" x="92.8" y="12.8" width="6.4" height="6.4" rx="3" fill="${w}" style="animation-delay:${(Math.random()*4).toFixed(2)}s"/>`;
  return `<g transform="translate(${tx.toFixed(1)} ${ty.toFixed(1)}) scale(${o.flip?-s:s} ${s})"><g class="hopper" data-say="${o.say||'Hi!'}"><g class="act ${o.act||''} ${o.walk?'walk':''}" style="${o.style||''}">
    ${backLegs}
    <ellipse class="tail" cx="16" cy="66" rx="7" ry="11" fill="${w}" stroke="${st}" stroke-width="1.5"/>
    <ellipse cx="52" cy="74" rx="38" ry="21" fill="${w}" stroke="${st}" stroke-width="1.5"/>
    <g fill="${lt}" opacity=".85"><circle cx="28" cy="60" r="7"/><circle cx="40" cy="56" r="8"/><circle cx="54" cy="55" r="8"/><circle cx="68" cy="58" r="7"/></g>
    ${frontLegs}
    ${o.body||''}
    <g class="neck" style="${o.neckStyle||''}">
      <rect x="76" y="20" width="18" height="62" rx="9" fill="${w}" stroke="${st}" stroke-width="1.5"/>
      <g fill="${lt}" opacity=".85"><circle cx="85" cy="40" r="6"/><circle cx="85" cy="54" r="6"/><circle cx="85" cy="66" r="6"/></g>
      <path class="ear" d="M80 12 L77 -6 Q84 0 87 10Z" fill="${w}" stroke="${st}" stroke-width="1.5"/>
      <path class="ear" d="M89 10 L92 -8 Q97 0 95 11Z" fill="${w}" stroke="${st}" stroke-width="1.5" style="animation-delay:.3s"/>
      <ellipse cx="92" cy="20" rx="15" ry="11" fill="${w}" stroke="${st}" stroke-width="1.5"/>
      <ellipse cx="106" cy="25" rx="9" ry="7" fill="${sn}" stroke="${st}" stroke-width="1.5"/>
      ${eye}
      <circle cx="111" cy="22.5" r="1.2" fill="#1d130c"/>
      <path d="M104 28 Q108 31 112 28" fill="none" stroke="#1d130c" stroke-width="1.4" stroke-linecap="round"/>
      <ellipse cx="99" cy="23" rx="3" ry="1.8" fill="#ff8fa3" opacity=".55"/>
      <rect x="76" y="34" width="18" height="6" rx="2" fill="${o.collar||'#e07a2f'}"/>
      ${o.head||''}
    </g>
  </g></g></g>`;
}

/* speech bubble that pops on a loop (world coords, tail points at x,y) */
function chat(x,y,text,delay=0,dur=9){
  const w=text.length*8.2+26;
  return `<g class="chat" style="animation-delay:${delay}s;animation-duration:${dur}s">
    <rect x="${x-w/2}" y="${y-44}" width="${w}" height="32" rx="14" fill="#fff" stroke="#2b1d12" stroke-width="2.5"/>
    <path d="M${x-8} ${y-13} L${x-2} ${y} L${x+7} ${y-13}" fill="#fff" stroke="#2b1d12" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="${x-9}" y="${y-16}" width="17" height="5" fill="#fff"/>
    <text x="${x}" y="${y-22}" text-anchor="middle" font-size="15.5" font-weight="700" fill="#2b1d12" ${F}>${text}</text></g>`;
}
const floaty=(x,y,t,d=0,size=22,fill='#2b1d12')=>`<text class="floaty" x="${x}" y="${y}" font-size="${size}" fill="${fill}" font-weight="700" ${F} style="animation-delay:${d}s">${t}</text>`;
const zzz=(x,y)=>floaty(x,y,'z',0,18)+floaty(x+8,y-4,'Z',1.1,22)+floaty(x+4,y,'z',2.2,16);
const pine=(x,y,h)=>`<g class="sway" style="animation-duration:5s;animation-delay:${-x%3}s"><rect x="${x-6}" y="${y-h*.25}" width="12" height="${h*.25}" fill="#6b4226"/>
  <polygon points="${x},${y-h} ${x-h*.28},${y-h*.48} ${x+h*.28},${y-h*.48}" fill="#2f7a3e"/>
  <polygon points="${x},${y-h*.78} ${x-h*.34},${y-h*.22} ${x+h*.34},${y-h*.22}" fill="#2a6d37"/></g>`;
const post=(x,y,w,h,text,size=15)=>`<rect x="${x-4}" y="${y}" width="8" height="${h}" fill="#6e3d1c"/><rect x="${x-w/2}" y="${y-30}" width="${w}" height="34" rx="6" fill="#c7854c" stroke="#6e3d1c" stroke-width="3"/>
  <text x="${x}" y="${y-8}" text-anchor="middle" font-size="${size}" font-weight="600" fill="#fff8ee" ${F}>${text}</text>`;

const hillSVG=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 100' preserveAspectRatio='none'><path fill='#86c56a' d='M0 100 L0 50 C150 0 280 10 420 40 C560 70 680 10 820 20 C900 26 960 46 1000 50 L1000 100Z'/></svg>`;
const mtn=$('mtn'), hills=$('hills');
mtn.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(mtnSVG)}")`;
hills.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(hillSVG)}")`;

const stars=$('stars');
for(let k=0;k<80;k++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(-Math.random()*3)+'s';stars.appendChild(s)}

/* =========================================================
   camera + layout
   ========================================================= */
let S=1, OY=0, SW=0, SH=0, visW=1000, cam=0, padL=0, areaW=1000;
const camWant=v=>clamp(tx-padL-areaW/2+v*.35,-padL,Math.max(0,WW-visW));
function layout(){
  const r=stage.getBoundingClientRect(); SW=r.width; SH=r.height;
  const desk=SW>760, CW=desk?$('card').offsetWidth+28:0, AW=SW-CW;
  S=Math.max(.3,Math.min(SH/WH, AW/(desk?1000:620))); OY=SH-WH*S; visW=SW/S; padL=CW/S; areaW=AW/S;
  mtn.style.top=(OY+150*S)+'px'; mtn.style.height=(220*S)+'px'; mtn.style.backgroundSize=`${1000*S}px ${220*S}px`;
  hills.style.top=(OY+262*S)+'px'; hills.style.height=(100*S)+'px'; hills.style.backgroundSize=`${900*S}px ${100*S}px`;
}
addEventListener('resize',layout); layout();

/* =========================================================
   truck physics
   ========================================================= */
let tx=500, tv=0, face=1, target=null, wheelA=0, L=false, R=false, puffT=0;
cam=camWant(0);
const MAX=560, ACC_=1000;
function driveTo(x){ target=clamp(x,110,WW-110); destEl.style.display='block'; destEl.style.left=target+'px'; destEl.style.top='600px'; }

function physics(dt){
  const input=(R?1:0)-(L?1:0);
  if(input){ target=null; destEl.style.display='none'; tv+=input*ACC_*dt; if(Math.sign(tv)!==input) tv+=input*ACC_*dt; }
  else if(target!==null){
    const d=target-tx;
    if(Math.abs(d)<2.5 && Math.abs(tv)<60){ tx=target; tv=0; target=null; destEl.style.display='none'; }
    else{ const want=Math.sign(d)*Math.min(MAX,Math.sqrt(2*800*Math.abs(d))); tv+=clamp(want-tv,-ACC_*1.6*dt,ACC_*1.6*dt); }
  } else { const f=1300*dt; tv=Math.abs(tv)<=f?0:tv-Math.sign(tv)*f; }
  tv=clamp(tv,-MAX,MAX); tx+=tv*dt;
  if(tx<110){tx=110;tv=Math.max(0,tv)} if(tx>WW-110){tx=WW-110;tv=Math.min(0,tv)}
  if(Math.abs(tv)>6) face=Math.sign(tv);
  wheelA+=Math.abs(tv)*dt/18*57.3;
  puffT-=dt;
  if(Math.abs(tv)>60 && puffT<=0){ puffT=.11; puff(); }
}
function puff(){
  const p=document.createElement('div'); p.className='puff';
  p.style.left=(face>0?tx-96:tx+80)+'px'; p.style.top='588px';
  world.appendChild(p); setTimeout(()=>p.remove(),900);
}

/* =========================================================
   card
   ========================================================= */
const card=$('card'), cardBody=$('cardBody');
let shown=-1, area=-1, stoppedT=0, visited=new Set();
function stopIndex(x){ return clamp(Math.floor(x/PW),0,N-1); }
function showStop(i){
  const st=STOPS[i]; shown=i; visited.add(i);
  $('kicker').textContent=`${st.icon} ${st.short} · ${st.kicker}`;
  $('title').textContent=st.title;
  const prev=STOPS[i-1], next=STOPS[i+1];
  cardBody.innerHTML=st.body+`<div class="report">🦙 <b>Llama report:</b> ${st.fun}</div>
    <div class="nav"><button data-go="${i-1}" ${prev?'':'disabled'}>◀ ${prev?prev.icon+' '+prev.short:'Start'}</button><button data-go="${i+1}" ${next?'':'disabled'}>${next?next.icon+' '+next.short:'The end'} ▶</button></div>`;
  cardBody.scrollTop=0;
  card.classList.remove('moving','collapsed'); $('cardHead').setAttribute('aria-expanded','true');
  card.classList.remove('bump'); void card.offsetWidth; card.classList.add('bump');
  $('visited').textContent=`${visited.size}/${N} visited`;
  drawMaps();
}
function showMoving(i){
  if(card.classList.contains('moving') && area===i) return;
  area=i; const st=STOPS[i];
  card.classList.add('moving');
  $('kicker').textContent='🚚 On the road…';
  $('title').textContent=target!==null?`Heading to ${STOPS[stopIndex(target)].icon} ${STOPS[stopIndex(target)].short}`:`Passing ${st.icon} ${st.short}`;
}
$('cardHead').addEventListener('click',()=>{
  if(card.classList.contains('moving')) return;
  const c=card.classList.toggle('collapsed'); $('cardHead').setAttribute('aria-expanded',String(!c));
});
cardBody.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b&&!b.disabled) driveTo(+b.dataset.go*PW+PW/2); });

/* =========================================================
   maps
   ========================================================= */
const MP=[[90,70],[300,70],[510,70],[510,210],[300,210],[90,210],[90,350],[300,350],[510,350]];
const MPATH='M90 70 H510 C590 70 590 210 510 210 H90 C10 210 10 350 90 350 H510';
function mapMarkup(big){
  let s=`<rect x="0" y="0" width="600" height="430" rx="16" fill="${big?'#cfe8b0':'#cfe8b0'}"/>`;
  if(big){
    s+=`<ellipse cx="200" cy="140" rx="40" ry="18" fill="#7cc6f2" opacity=".8"/><ellipse cx="420" cy="290" rx="30" ry="14" fill="#7cc6f2" opacity=".8"/>`;
    [[40,130],[560,140],[170,285],[450,140],[560,290],[40,300],[400,400],[200,405]].forEach(([x,y])=>s+=`<polygon points="${x},${y-18} ${x-11},${y+4} ${x+11},${y+4}" fill="#3f8f3a"/><rect x="${x-2}" y="${y+4}" width="4" height="6" fill="#6b4226"/>`);
    s+=`<g transform="translate(574 32) scale(.8)"><circle r="20" fill="#fff8ec" stroke="#6e3d1c" stroke-width="2"/><polygon points="0,-16 5,0 0,4 -5,0" fill="#c0392b"/><text y="-22" text-anchor="middle" font-size="12" font-weight="700" ${F}>N</text></g>`;
  }
  s+=`<path d="${MPATH}" fill="none" stroke="#c9a26b" stroke-width="${big?26:30}" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${MPATH}" fill="none" stroke="#fff8ec" stroke-width="3" stroke-dasharray="12 12"/>`;
  STOPS.forEach((st,i)=>{
    const [x,y]=MP[i], v=visited.has(i), cur=i===shown;
    s+=`<g class="stop" data-i="${i}" ${big?`tabindex="0" role="button" aria-label="Drive to ${st.short}"`:''}>
      <circle class="ring" cx="${x}" cy="${y}" r="${big?34:38}" fill="${cur?'#ffe2b8':'#fff8ec'}" stroke="${cur?'#d9661f':'#6e3d1c'}" stroke-width="${cur?6:4}"/>
      <text x="${x}" y="${y+(big?11:13)}" text-anchor="middle" font-size="${big?30:36}">${st.icon}</text>
      ${big?`<rect x="${x-62}" y="${y+40}" width="124" height="24" rx="12" fill="#6e3d1c"/><text x="${x}" y="${y+57}" text-anchor="middle" font-size="14" font-weight="600" fill="#fff8ec" ${F}>${st.short}</text>`:''}
      ${v?`<circle cx="${x+26}" cy="${y-26}" r="${big?11:13}" fill="#2ca01c" stroke="#fff" stroke-width="2"/><text x="${x+26}" y="${y-21}" text-anchor="middle" font-size="${big?13:16}" font-weight="700" fill="#fff">✓</text>`:''}
    </g>`;
  });
  s+=`<g class="mk"><circle r="${big?16:22}" fill="#e04a33" stroke="#fff" stroke-width="4"/><text y="${big?6:8}" text-anchor="middle" font-size="${big?17:24}">🚚</text></g>`;
  return s;
}
const miniSvg=$('miniSvg'), bigSvg=$('bigSvg');
function drawMaps(){ miniSvg.innerHTML=mapMarkup(false); bigSvg.innerHTML=mapMarkup(true); placeMarkers(); }
function placeMarkers(){
  const f=clamp((tx-PW/2)/PW,0,N-1), i=Math.min(N-2,Math.floor(f)), t=f-i;
  const x=MP[i][0]+(MP[i+1][0]-MP[i][0])*t, y=MP[i][1]+(MP[i+1][1]-MP[i][1])*t-(miniSvg?0:0);
  document.querySelectorAll('.mk').forEach(m=>m.setAttribute('transform',`translate(${x.toFixed(1)} ${(y-30).toFixed(1)})`));
}
const mapModal=$('mapModal');
function openMap(){ drawMaps(); mapModal.classList.add('open'); setTimeout(()=>bigSvg.querySelector('.stop')?.focus(),50); }
function closeMap(){ mapModal.classList.remove('open'); }
$('mini').addEventListener('click',openMap);
$('mapClose').addEventListener('click',closeMap);
mapModal.addEventListener('click',e=>{ if(e.target===mapModal) closeMap(); });
bigSvg.addEventListener('click',e=>{ const g=e.target.closest('.stop'); if(g){ closeMap(); driveTo(+g.dataset.i*PW+PW/2); } });
bigSvg.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ const g=e.target.closest('.stop'); if(g){ e.preventDefault(); closeMap(); driveTo(+g.dataset.i*PW+PW/2); } } });

/* =========================================================
   input
   ========================================================= */
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea')) return;
  const k=e.key.toLowerCase();
  if(mapModal.classList.contains('open')){ if(k==='escape'||k==='m') closeMap(); return; }
  if(k==='arrowleft'||k==='a'){L=true;$('leftBtn').classList.add('on');e.preventDefault()}
  else if(k==='arrowright'||k==='d'){R=true;$('rightBtn').classList.add('on');e.preventDefault()}
  else if(k==='h'||k===' '){ if(!e.repeat) honk(); e.preventDefault() }
  else if(k==='m'){ openMap() }
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a'){L=false;$('leftBtn').classList.remove('on')}
  if(k==='arrowright'||k==='d'){R=false;$('rightBtn').classList.remove('on')}
});
addEventListener('blur',()=>{L=R=false});
function holdBtn(btn,on,off){
  btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);on()});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,off));
}
holdBtn($('leftBtn'),()=>L=true,()=>L=false);
holdBtn($('rightBtn'),()=>R=true,()=>R=false);
$('honkBtn').addEventListener('click',honk);

/* click a llama → it hops and talks; click elsewhere on the farm → drive there */
stage.addEventListener('click',e=>{
  if(e.target.closest('.ui')) return;
  const h=e.target.closest('.hopper');
  if(h){ hop(h); say(h,h.dataset.say); return; }
  const r=stage.getBoundingClientRect();
  if(e.clientY-r.top<OY+300*S) return; // sky clicks do nothing
  driveTo(cam+(e.clientX-r.left)/S);
});
function hop(h){ h.classList.remove('hop'); void h.getBoundingClientRect(); h.classList.add('hop'); setTimeout(()=>h.classList.remove('hop'),600); }
function say(el,text){
  const r=el.getBoundingClientRect(), sr=stage.getBoundingClientRect();
  const b=document.createElement('div'); b.className='say'; b.textContent=text;
  b.style.left=(r.left+r.width/2-sr.left)+'px'; b.style.top=(r.top-sr.top-6)+'px';
  stage.appendChild(b); setTimeout(()=>b.remove(),2000);
}
let audio=null;
function honk(){
  const hb=$('honkBubble'); hb.classList.add('show'); setTimeout(()=>hb.classList.remove('show'),700);
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    const now=audio.currentTime;
    [[0,370],[.17,330]].forEach(([t,f])=>{const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;
      g.gain.setValueAtTime(0,now+t);g.gain.linearRampToValueAtTime(.08,now+t+.02);g.gain.linearRampToValueAtTime(0,now+t+.15);
      o.connect(g).connect(audio.destination);o.start(now+t);o.stop(now+t+.16);});
  }catch(_){}
  const st=STOPS[stopIndex(tx)];
  st.el.querySelectorAll('.hopper').forEach((h,k)=>setTimeout(()=>hop(h),k*70));
}

/* day / night */
const nightBtn=$('nightBtn');
function setNight(on){ document.body.classList.toggle('night',on); nightBtn.textContent=on?'☀️':'🌙'; }
try{ if(matchMedia('(prefers-color-scheme: dark)').matches) setNight(true); }catch(_){}
nightBtn.addEventListener('click',()=>setNight(!document.body.classList.contains('night')));
$('sun').addEventListener('click',()=>setNight(!document.body.classList.contains('night')));

/* =========================================================
   main loop
   ========================================================= */
let last=performance.now(), lastCamBucket=-1;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  physics(dt);
  const want=camWant(tv);
  cam+=(want-cam)*Math.min(1,dt*5);
  world.style.transform=`translate(${(-cam*S).toFixed(2)}px,${OY.toFixed(2)}px) scale(${S})`;
  mtn.style.backgroundPositionX=(-cam*S*.15)+'px';
  hills.style.backgroundPositionX=(-cam*S*.4)+'px';
  truck.style.transform=`translate(${(tx-90).toFixed(1)}px,512px)`;
  truck.classList.toggle('left',face<0);
  truck.classList.toggle('moving',Math.abs(tv)>8);
  w1.style.transform=w2.style.transform=`rotate(${wheelA.toFixed(1)}deg)`;

  const b=Math.round(cam/100);
  if(b!==lastCamBucket){ lastCamBucket=b; STOPS.forEach((st,i)=>{ const x0=i*PW; st.el.classList.toggle('off', x0+PW<cam-150 || x0>cam+visW+150); }); }

  const i=stopIndex(tx);
  if(Math.abs(tv)<1 && target===null){
    stoppedT+=dt;
    if(stoppedT>.3 && (shown!==i || card.classList.contains('moving'))) showStop(i);
  } else { stoppedT=0; if(Math.abs(tv)>40) showMoving(i); }
  placeMarkers();
  requestAnimationFrame(frame);
}
drawMaps();
requestAnimationFrame(frame);
</script>
</body>
</html>
