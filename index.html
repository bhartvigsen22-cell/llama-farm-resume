<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hartvigsen Llama Farm</title>
<meta name="description" content="Bryndalin Hartvigsen's resume as an interactive llama farm. Click a llama to learn more.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#7cc6f2; --sky-bot:#d6f0ff;
  --mtn:#8aa3c2; --mtn-far:#b2c4dc; --snow:#ffffff;
  --hill-back:#86c56a; --hill-front:#5fae4a; --pasture:#6fbf55; --pasture-dark:#57a843;
  --wood:#9a5b2e; --wood-dark:#6e3d1c; --wood-light:#c7854c;
  --barn:#c0392b; --barn-dark:#8e2a1f; --trim:#fff8ee;
  --ink:#2b1d12; --card:#fff8ec; --card-edge:#e8d3b0; --muted:#6b5643;
  --accent:#e07a2f;
  --sun:#ffd54a; --glow:rgba(255,213,74,.45);
  --window:#3c2a1a;
  --star-opacity:0;
}
body.night{
  --sky-top:#0b1533; --sky-bot:#2b3a6b;
  --mtn:#36466b; --mtn-far:#4a5a82; --snow:#c9d4ee;
  --hill-back:#2f5a3a; --hill-front:#264d31; --pasture:#2d5a34; --pasture-dark:#234a2a;
  --barn:#7d261d; --barn-dark:#561a13; --trim:#d9cfc0;
  --sun:#f4f1dc; --glow:rgba(244,241,220,.25);
  --window:#ffcf6b;
  --star-opacity:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:var(--sky-top);overflow:hidden;
  transition:background .8s;
}
button{font:inherit;color:inherit}
.scene{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(var(--sky-top),var(--sky-bot) 62%);transition:background .8s}

/* stars */
.stars{position:absolute;inset:0 0 40% 0;opacity:var(--star-opacity);transition:opacity 1s;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 3s infinite ease-in-out}
@keyframes twinkle{50%{opacity:.2}}

/* sun / moon */
.sun{position:absolute;top:7vh;right:12vw;width:clamp(60px,9vw,110px);aspect-ratio:1;border-radius:50%;
  background:var(--sun);box-shadow:0 0 0 18px var(--glow),0 0 80px 30px var(--glow);
  animation:pulse 5s ease-in-out infinite;transition:background .8s,box-shadow .8s;cursor:pointer}
body.night .sun{box-shadow:inset -18px -6px 0 0 #d8d3b4,0 0 60px 10px var(--glow)}
@keyframes pulse{50%{transform:scale(1.06)}}

/* clouds */
.cloud{position:absolute;left:-220px;width:120px;height:40px;border-radius:40px;background:#fff;opacity:.92;
  animation:drift linear infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.04));transition:opacity .8s}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:56px;height:56px;left:18px;top:-28px}
.cloud::after{width:42px;height:42px;left:62px;top:-18px}
body.night .cloud{opacity:.18}
@keyframes drift{to{transform:translateX(calc(100vw + 440px))}}

/* landscape svg layers */
.land{position:absolute;left:0;width:100%;pointer-events:none}
.land path,.land polygon{transition:fill .8s}

/* windmill */
.windmill{position:absolute;right:4vw;bottom:44vh;width:clamp(70px,9vw,120px);z-index:2;pointer-events:none}
.windmill .blades{transform-origin:50px 30px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* barn */
.barn{position:absolute;left:3vw;bottom:40vh;width:clamp(130px,19vw,250px);z-index:3;cursor:pointer;
  background:none;border:0;padding:0;transition:transform .2s}
.barn:hover,.barn:focus-visible{transform:translateY(-4px) rotate(-1deg)}
.barn svg{width:100%;display:block;overflow:visible}
.barn .tag{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);white-space:nowrap}

/* mailbox */
.mailbox{position:absolute;right:3vw;bottom:36vh;width:clamp(44px,5vw,64px);z-index:4;cursor:pointer;
  background:none;border:0;padding:0}
.mailbox svg{width:100%;display:block;overflow:visible}
.mailbox .flag{transform-origin:46px 30px;transition:transform .4s cubic-bezier(.5,1.8,.5,1)}
.mailbox:hover .flag,.mailbox:focus-visible .flag{transform:rotate(-70deg)}
.mailbox .tag{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);white-space:nowrap}

.tag{font-family:'Fredoka',sans-serif;font-size:13px;font-weight:600;background:var(--card);border:2px solid var(--wood-dark);
  padding:2px 9px;border-radius:999px;color:var(--ink);box-shadow:0 2px 0 var(--wood-dark)}

/* header sign */
.sign{position:absolute;top:2.2vh;left:50%;transform:translateX(-50%);z-index:20;text-align:center;
  width:min(560px,calc(100vw - 32px));animation:sway 6s ease-in-out infinite;transform-origin:50% -40px}
.sign .ropes{position:absolute;inset:-40px 0 auto 0;height:40px;display:flex;justify-content:space-between;padding:0 18%}
.sign .ropes i{width:3px;background:#7a5a3a;height:100%}
.sign .plank{background:linear-gradient(var(--wood-light),var(--wood));border:4px solid var(--wood-dark);border-radius:14px;
  padding:12px 18px 12px;box-shadow:0 8px 0 rgba(0,0,0,.18);color:#fff8ee;
  background-image:repeating-linear-gradient(0deg,transparent 0 22px,rgba(0,0,0,.08) 22px 24px),linear-gradient(var(--wood-light),var(--wood))}
.sign h1{margin:0;font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(22px,4.2vw,40px);line-height:1.05;
  text-shadow:0 3px 0 var(--wood-dark);letter-spacing:.5px}
.sign p{margin:6px 0 0;font-weight:700;font-size:clamp(12px,1.8vw,15px);opacity:.95}
.sign .hint{display:inline-block;margin-top:8px;font-size:12px;background:rgba(0,0,0,.18);padding:3px 10px;border-radius:999px}
@keyframes sway{0%,100%{transform:translateX(-50%) rotate(-1.2deg)}50%{transform:translateX(-50%) rotate(1.2deg)}}

/* night toggle */
.toggle{position:absolute;top:14px;right:14px;z-index:30;width:44px;height:44px;border-radius:50%;
  border:3px solid var(--wood-dark);background:var(--card);font-size:20px;cursor:pointer;box-shadow:0 3px 0 var(--wood-dark)}
.toggle:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-dark)}

/* pasture */
.pasture{position:absolute;left:0;right:0;bottom:0;height:44vh;z-index:5}
.fence{position:absolute;left:0;right:0;bottom:44vh;height:46px;z-index:4;pointer-events:none;
  background:
    linear-gradient(var(--wood) 0 0) 0 10px/100% 7px no-repeat,
    linear-gradient(var(--wood) 0 0) 0 28px/100% 7px no-repeat,
    repeating-linear-gradient(90deg,var(--wood-dark) 0 9px,transparent 9px 90px);
  transform:translateY(16px)}
.tuft{position:absolute;bottom:0;width:22px;height:16px;pointer-events:none}
.tuft::before,.tuft::after{content:"";position:absolute;bottom:0;width:6px;height:16px;border-radius:6px 6px 0 0;background:var(--pasture-dark);
  transform-origin:bottom;animation:grass 3s ease-in-out infinite}
.tuft::before{left:4px;transform:rotate(-14deg)}
.tuft::after{left:12px;transform:rotate(12deg);animation-delay:.6s}
@keyframes grass{50%{transform:rotate(4deg)}}
.flower{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;
  box-shadow:0 -6px 0 currentColor,0 6px 0 currentColor,-6px 0 0 currentColor,6px 0 0 currentColor;background:#ffd54a}

/* llamas */
.llama{position:absolute;left:0;bottom:0;width:var(--w);cursor:pointer;background:none;border:0;padding:0;
  transform:translate(-50%,0);-webkit-tap-highlight-color:transparent}
.llama:focus-visible{outline:3px dashed var(--accent);outline-offset:4px;border-radius:12px}
.llama .shadow{position:absolute;left:12%;right:12%;bottom:-4%;height:12%;border-radius:50%;background:rgba(0,0,0,.18)}
.llama .flip{transition:transform .25s}
.llama.left .flip{transform:scaleX(-1)}
.llama svg{width:100%;display:block;overflow:visible}
.llama .bob{transform-origin:50% 100%}
.llama.walking .bob{animation:bob .5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3%)}}
.llama .leg{transform-box:fill-box;transform-origin:50% 0}
.llama.walking .leg.a{animation:swing .5s ease-in-out infinite}
.llama.walking .leg.b{animation:swing .5s ease-in-out infinite reverse}
@keyframes swing{0%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}100%{transform:rotate(-16deg)}}
.llama .neck{transform-box:view-box;transform-origin:84px 74px}
.llama.idle .neck{animation:nod 2.6s ease-in-out infinite}
@keyframes nod{0%,60%,100%{transform:rotate(0)}75%{transform:rotate(10deg)}88%{transform:rotate(4deg)}}
.llama .tail{transform-box:fill-box;transform-origin:100% 20%;animation:wag 1.4s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(14deg)}}
.llama .ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 4s ease-in-out infinite}
@keyframes ear{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-18deg)}}
.llama .eye-lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(0)}97%{transform:scaleY(1)}}
.llama.hop .bob{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%) rotate(-4deg)}}
.llama .name{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%) scale(.8);opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.llama:hover .name,.llama:focus-visible .name{opacity:1;transform:translate(-50%,-100%) scale(1)}
.bubble{position:absolute;left:58%;top:-8%;transform:translate(-20%,-100%) scale(0);transform-origin:10% 100%;
  background:#fff;border:2px solid var(--ink);border-radius:14px;padding:6px 10px;font-weight:700;font-size:13px;white-space:nowrap;
  transition:transform .3s cubic-bezier(.4,1.7,.5,1);pointer-events:none;z-index:2;color:#2b1d12}
.bubble::after{content:"";position:absolute;left:12px;bottom:-9px;width:12px;height:12px;background:#fff;border:2px solid var(--ink);
  border-top:0;border-left:0;transform:rotate(45deg)}
.bubble.show{transform:translate(-20%,-100%) scale(1)}
.llama:hover .bubble{transform:translate(-20%,-100%) scale(0)}

/* hearts */
.heart{position:absolute;pointer-events:none;font-size:20px;z-index:200;animation:float 1.2s ease-out forwards}
@keyframes float{to{transform:translateY(-70px) scale(1.4);opacity:0}}

/* dock */
.dock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:150;display:flex;gap:6px;
  max-width:calc(100vw - 24px);overflow-x:auto;padding:8px;border-radius:16px;
  background:rgba(110,61,28,.85);border:3px solid var(--wood-dark);box-shadow:0 4px 0 rgba(0,0,0,.2);scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dock button{flex:none;display:flex;align-items:center;gap:5px;border:2px solid var(--wood-dark);background:var(--card);
  border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 var(--wood-dark);color:#2b1d12}
.dock button:hover{background:#ffe8c4}
.dock button:active{transform:translateY(2px);box-shadow:none}
.dock .e{font-size:16px}

/* modal */
.modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:16px;background:rgba(30,18,8,.45);
  opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:auto}
.card{position:relative;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);color:#2b1d12;
  border:4px solid var(--wood-dark);border-radius:20px;box-shadow:0 12px 0 rgba(0,0,0,.2);
  transform:translateY(30px) scale(.94) rotate(-1deg);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.modal.open .card{transform:none}
.card-head{display:flex;gap:14px;align-items:center;padding:18px 20px 14px;border-bottom:3px dashed var(--card-edge);
  background:linear-gradient(135deg,#ffe9c7,#fff8ec)}
.card-head .portrait{width:84px;flex:none;background:#d6f0ff;border-radius:50%;aspect-ratio:1;display:grid;place-items:end center;overflow:hidden;border:3px solid var(--wood-dark)}
.card-head .portrait svg{width:96%;transform:translate(-14%,6%)}
.card-head small{display:block;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:1px;font-size:12px}
.card-head h2{margin:2px 0 0;font-family:'Fredoka',sans-serif;font-size:clamp(20px,3.6vw,26px);line-height:1.15}
.card-body{padding:16px 22px 22px}
.entry{margin-bottom:16px}
.entry:last-child{margin-bottom:0}
.entry h3{margin:0;font-family:'Fredoka',sans-serif;font-size:18px;font-weight:600}
.entry .meta{color:#6b5643;font-weight:700;font-size:14px;margin-top:2px}
.entry ul{margin:8px 0 0;padding-left:0;list-style:none}
.entry li{position:relative;padding-left:26px;margin:6px 0;line-height:1.45}
.entry li::before{content:"🌾";position:absolute;left:0;top:0;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{background:#ffe8c4;border:2px solid var(--card-edge);border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px}
.gpa{display:inline-flex;align-items:baseline;gap:6px;background:#2b1d12;color:#ffd54a;border-radius:12px;padding:6px 14px;margin-top:4px;font-family:'Fredoka',sans-serif}
.gpa b{font-size:28px}
.close{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:2px solid var(--wood-dark);
  background:#fff;cursor:pointer;font-size:18px;font-weight:700;color:#2b1d12}
.card a{color:#b0521a;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:640px){
  .barn{bottom:41vh;left:2vw}
  .windmill{display:none}
  .mailbox{bottom:40vh}
  .sign .hint{display:none}
  .pasture{height:42vh}
  .fence{bottom:42vh}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0s!important;animation-iteration-count:1!important}
}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="stars" id="stars"></div>
  <div class="sun" id="sun" title="Toggle day / night"></div>
  <div class="cloud" style="top:12vh;animation-duration:70s;animation-delay:-10s"></div>
  <div class="cloud" style="top:22vh;animation-duration:95s;animation-delay:-50s;transform:scale(.7)"></div>
  <div class="cloud" style="top:6vh;animation-duration:120s;animation-delay:-80s"></div>

  <!-- mountains (Wasatch Plateau vibes) -->
  <svg class="land" style="bottom:40vh;height:30vh" viewBox="0 0 1000 300" preserveAspectRatio="none" aria-hidden="true">
    <polygon fill="var(--mtn-far)" points="0,300 0,170 90,110 170,150 260,70 350,140 430,100 520,160 610,60 700,130 790,90 880,150 1000,100 1000,300"/>
    <polygon fill="var(--mtn)" points="0,300 0,220 120,150 230,210 330,130 450,220 560,140 680,230 780,160 900,220 1000,180 1000,300"/>
    <polygon fill="var(--snow)" points="260,70 240,100 255,96 268,106 282,94 290,104 300,96"/>
    <polygon fill="var(--snow)" points="610,60 588,92 602,88 615,100 628,86 640,96 650,90"/>
  </svg>
  <!-- hills -->
  <svg class="land" style="bottom:38vh;height:14vh" viewBox="0 0 1000 140" preserveAspectRatio="none" aria-hidden="true">
    <path fill="var(--hill-back)" d="M0 140 L0 70 C150 10 280 20 420 60 C560 100 680 20 820 30 C900 36 960 60 1000 50 L1000 140Z"/>
  </svg>
  <svg class="land" style="bottom:0;height:47vh" viewBox="0 0 1000 470" preserveAspectRatio="none" aria-hidden="true">
    <path fill="var(--hill-front)" d="M0 470 L0 40 C200 0 380 30 520 20 C700 8 860 40 1000 16 L1000 470Z"/>
    <path fill="var(--pasture)" d="M0 470 L0 80 C220 50 420 70 600 60 C780 50 900 70 1000 60 L1000 470Z"/>
  </svg>

  <!-- windmill -->
  <svg class="windmill" viewBox="0 0 100 160" aria-hidden="true">
    <polygon points="44,30 56,30 70,160 30,160" fill="var(--trim)" stroke="var(--wood-dark)" stroke-width="2"/>
    <line x1="38" y1="80" x2="62" y2="80" stroke="var(--wood-dark)" stroke-width="2"/>
    <line x1="34" y1="120" x2="66" y2="120" stroke="var(--wood-dark)" stroke-width="2"/>
    <g class="blades" fill="var(--barn)" stroke="var(--wood-dark)" stroke-width="2">
      <path d="M50 30 L46 -8 L54 -8Z"/><path d="M50 30 L88 26 L88 34Z"/><path d="M50 30 L54 68 L46 68Z"/><path d="M50 30 L12 34 L12 26Z"/>
      <circle cx="50" cy="30" r="5" fill="var(--trim)"/>
    </g>
  </svg>

  <div class="fence"></div>

  <!-- barn = Education -->
  <button class="barn" id="barn" aria-label="Open the Schoolhouse Barn: Education">
    <span class="tag">🎓 Schoolhouse Barn</span>
    <svg viewBox="0 0 200 170" aria-hidden="true">
      <polygon points="10,70 100,10 190,70" fill="var(--barn-dark)"/>
      <polygon points="0,74 100,4 200,74 190,80 100,18 10,80" fill="var(--trim)"/>
      <rect x="18" y="72" width="164" height="98" fill="var(--barn)"/>
      <g stroke="var(--barn-dark)" stroke-width="2" opacity=".5">
        <line x1="40" y1="72" x2="40" y2="170"/><line x1="62" y1="72" x2="62" y2="170"/><line x1="138" y1="72" x2="138" y2="170"/><line x1="160" y1="72" x2="160" y2="170"/>
      </g>
      <rect x="80" y="36" width="40" height="26" rx="3" fill="var(--window)" stroke="var(--trim)" stroke-width="4"/>
      <rect x="70" y="100" width="60" height="70" fill="var(--barn-dark)" stroke="var(--trim)" stroke-width="5"/>
      <path d="M70 100 L130 170 M130 100 L70 170" stroke="var(--trim)" stroke-width="5"/>
      <rect x="28" y="88" width="26" height="22" fill="var(--window)" stroke="var(--trim)" stroke-width="4"/>
      <rect x="146" y="88" width="26" height="22" fill="var(--window)" stroke="var(--trim)" stroke-width="4"/>
      <text x="100" y="54" text-anchor="middle" font-size="16">📐</text>
    </svg>
  </button>

  <!-- mailbox = contact -->
  <button class="mailbox" id="mailbox" aria-label="Open the mailbox: contact information">
    <span class="tag">📬 Say hi</span>
    <svg viewBox="0 0 60 110" aria-hidden="true">
      <rect x="26" y="34" width="8" height="76" fill="var(--wood)"/>
      <path d="M6 20 Q6 4 22 4 L44 4 Q54 4 54 20 L54 40 L6 40Z" fill="#4a7fc1" stroke="#2c5384" stroke-width="3"/>
      <ellipse cx="10" cy="22" rx="4" ry="16" fill="#2c5384"/>
      <g class="flag"><rect x="44" y="12" width="4" height="22" fill="#c0392b"/><rect x="44" y="12" width="12" height="8" fill="#c0392b"/></g>
    </svg>
  </button>

  <div class="sign">
    <div class="ropes"><i></i><i></i></div>
    <div class="plank">
      <h1>Bryndalin Hartvigsen</h1>
      <p>Mathematics · Snow College 2026 · Ephraim, UT</p>
      <span class="hint">🦙 Click a llama, the barn, or the mailbox</span>
    </div>
  </div>

  <button class="toggle" id="toggle" aria-label="Toggle day and night">🌙</button>

  <div class="pasture" id="pasture"></div>

  <nav class="dock" id="dock" aria-label="Resume sections"></nav>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <div class="card" id="card">
    <button class="close" id="close" aria-label="Close">✕</button>
    <div class="card-head">
      <div class="portrait" id="portrait"></div>
      <div><small id="cardKicker"></small><h2 id="cardTitle"></h2></div>
    </div>
    <div class="card-body" id="cardBody"></div>
  </div>
</div>

<script>
/* ---------- resume content ---------- */
const EDUCATION = {
  kicker:'The Schoolhouse Barn', title:'Education', wool:'#f3e6cf', emoji:'🎓',
  body:`
    <div class="entry"><h3>Snow College</h3><div class="meta">Associate of Science, Mathematics · 2026</div></div>
    <div class="entry"><h3>Snow College</h3><div class="meta">Outdoor Leadership and Entrepreneurship · 2022–2026</div></div>
    <div class="entry"><h3>Weber State University</h3><div class="meta">Concurrent Enrollment · 2021–2022</div></div>
    <div class="entry"><span class="gpa"><b>3.95</b> GPA</span></div>`
};
const CONTACT = {
  kicker:'The Mailbox', title:'Get in touch', wool:'#e8c9a0', emoji:'📬',
  body:`
    <div class="entry"><h3>Bryndalin Hartvigsen</h3><div class="meta">Ephraim, Utah</div>
      <ul><li>Phone: <a href="tel:+18888888888">888-888-8888</a></li></ul></div>`
};

const LLAMAS = [
  { id:'fluff', name:'Professor Fluff', label:'Education', emoji:'🎓', wool:'#f3e6cf',
    say:'3.95 GPA, baaa—I mean, hmm!', card:EDUCATION },

/* ---------- llama drawing ---------- */
function shade(hex, amt){
  const n=parseInt(hex.slice(1),16);
  const c=[n>>16,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v+amt))));
  return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join('');
}
function llamaSVG(l){
  const w=l.wool, dk=shade(w,-38), lt=shade(w,28), snout=l.dark?shade(w,60):shade(w,-14);
  const stroke=shade(w,-80);
  return `<svg viewBox="0 -12 124 142" aria-hidden="true">
    <g class="leg b" ><rect x="30" y="80" width="8" height="42" rx="4" fill="${dk}"/><rect x="29" y="118" width="10" height="6" rx="2" fill="#3b2a1d"/></g>
    <g class="leg a"><rect x="68" y="80" width="8" height="42" rx="4" fill="${dk}"/><rect x="67" y="118" width="10" height="6" rx="2" fill="#3b2a1d"/></g>
    <ellipse class="tail" cx="16" cy="66" rx="7" ry="11" fill="${w}" stroke="${stroke}" stroke-width="1.5"/>
    <g stroke="${stroke}" stroke-width="1.5">
      <ellipse cx="52" cy="74" rx="38" ry="21" fill="${w}"/>
    </g>
    <g fill="${lt}" opacity=".85">
      <circle cx="28" cy="60" r="7"/><circle cx="40" cy="56" r="8"/><circle cx="54" cy="55" r="8"/><circle cx="68" cy="58" r="7"/>
    </g>
    <g class="leg a"><rect x="22" y="82" width="9" height="42" rx="4" fill="${w}" stroke="${stroke}" stroke-width="1.5"/><rect x="21" y="120" width="11" height="6" rx="2" fill="#3b2a1d"/></g>
    <g class="leg b"><rect x="76" y="82" width="9" height="42" rx="4" fill="${w}" stroke="${stroke}" stroke-width="1.5"/><rect x="75" y="120" width="11" height="6" rx="2" fill="#3b2a1d"/></g>
    <g class="neck">
      <rect x="76" y="20" width="18" height="62" rx="9" fill="${w}" stroke="${stroke}" stroke-width="1.5"/>
      <g fill="${lt}" opacity=".85"><circle cx="85" cy="40" r="6"/><circle cx="85" cy="54" r="6"/><circle cx="85" cy="66" r="6"/></g>
      <path class="ear" d="M80 12 L77 -6 Q84 0 87 10Z" fill="${w}" stroke="${stroke}" stroke-width="1.5"/>
      <path class="ear" d="M89 10 L92 -8 Q97 0 95 11Z" fill="${w}" stroke="${stroke}" stroke-width="1.5" style="animation-delay:.3s"/>
      <ellipse cx="92" cy="20" rx="15" ry="11" fill="${w}" stroke="${stroke}" stroke-width="1.5"/>
      <ellipse cx="106" cy="25" rx="9" ry="7" fill="${snout}" stroke="${stroke}" stroke-width="1.5"/>
      <circle cx="96" cy="16" r="2.6" fill="#1d130c"/><circle cx="96.8" cy="15.2" r=".9" fill="#fff"/>
      <rect class="eye-lid" x="92.8" y="12.8" width="6.4" height="6.4" rx="3" fill="${w}"/>
      <circle cx="111" cy="22.5" r="1.2" fill="#1d130c"/>
      <path d="M104 28 Q108 31 112 28" fill="none" stroke="#1d130c" stroke-width="1.4" stroke-linecap="round"/>
      <ellipse cx="99" cy="23" rx="3" ry="1.8" fill="#ff8fa3" opacity=".55"/>
      <rect x="76" y="34" width="18" height="6" rx="2" fill="#e07a2f"/>
      <text x="85" y="-4" text-anchor="middle" font-size="16">${l.emoji}</text>
    </g>
  </svg>`;
}

/* ---------- scene setup ---------- */
const pasture=document.getElementById('pasture');
const dock=document.getElementById('dock');
const rand=(a,b)=>a+Math.random()*(b-a);

// grass + flowers
for(let i=0;i<40;i++){
  const t=document.createElement('i'); t.className='tuft';
  t.style.left=rand(0,100)+'%'; t.style.bottom=rand(0,92)+'%'; t.style.zIndex=0;
  t.style.animationDelay=rand(-3,0)+'s'; pasture.appendChild(t);
}
const fc=['#ff6b8b','#ffffff','#b48cff','#ff9f43'];
for(let i=0;i<22;i++){
  const f=document.createElement('i'); f.className='flower';
  f.style.left=rand(2,98)+'%'; f.style.bottom=rand(2,90)+'%'; f.style.color=fc[i%fc.length];
  f.style.transform=`scale(${rand(.5,.9)})`; pasture.appendChild(f);
}
// stars
const stars=document.getElementById('stars');
for(let i=0;i<70;i++){
  const s=document.createElement('i'); s.style.left=rand(0,100)+'%'; s.style.top=rand(0,100)+'%';
  s.style.animationDelay=rand(-3,0)+'s'; stars.appendChild(s);
}

// llamas
const herd=LLAMAS.map((l,i)=>{
  const el=document.createElement('button');
  el.className='llama idle'; el.setAttribute('aria-label',`${l.name}: ${l.label}`);
  el.innerHTML=`<span class="tag name">${l.emoji} ${l.name}</span><span class="bubble">${l.say}</span>
    <div class="shadow"></div><div class="flip"><div class="bob">${llamaSVG(l)}</div></div>`;
  pasture.appendChild(el);
  const st={l,el,x:8+ (i/(LLAMAS.length-1))*84 + rand(-3,3), y:rand(18,70), tx:0, ty:0, mode:'idle', t:rand(0.5,3), paused:false};
  el.addEventListener('click',()=>open(st));
  const b=document.createElement('button');
  b.innerHTML=`<span class="e">${l.emoji}</span>${l.label}`;
  b.addEventListener('click',()=>open(st));
  dock.appendChild(b);
  return st;
});

function place(s){
  const scale=1-(s.y/100)*0.42;
  s.el.style.left=s.x+'%';
  s.el.style.bottom=s.y+'%';
  s.el.style.setProperty('--w',`calc(clamp(78px, 12.5vw, 170px) *${scale.toFixed(3)})`);
  s.el.style.zIndex=String(100-Math.round(s.y));
}
herd.forEach(place);

let last=performance.now();
function tick(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  for(const s of herd){
    if(s.paused) continue;
    s.t-=dt;
    if(s.mode==='idle' && s.t<=0){
      s.tx=Math.max(6,Math.min(94,s.x+rand(-30,30)));
      s.ty=Math.max(18,Math.min(72,s.y+rand(-25,25)));
      s.mode='walk'; s.el.classList.replace('idle','walking');
      s.el.classList.toggle('left', s.tx<s.x);
    }else if(s.mode==='walk'){
      const dx=s.tx-s.x, dy=s.ty-s.y, d=Math.hypot(dx,dy), sp=5*dt;
      if(d<sp){ s.x=s.tx; s.y=s.ty; s.mode='idle'; s.t=rand(2,6); s.el.classList.replace('walking','idle'); }
      else { s.x+=dx/d*sp; s.y+=dy/d*sp; }
      place(s);
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// random chatter
setInterval(()=>{
  if(modal.classList.contains('open')) return;
  const s=herd[Math.floor(Math.random()*herd.length)];
  const b=s.el.querySelector('.bubble'); b.classList.add('show');
  setTimeout(()=>b.classList.remove('show'),2600);
},3200);

/* ---------- modal ---------- */
const modal=document.getElementById('modal');
let current=null, lastFocus=null;
function showCard(c, l){
  document.getElementById('cardKicker').textContent=c.kicker;
  document.getElementById('cardTitle').textContent=c.title;
  document.getElementById('cardBody').innerHTML=c.body;
  document.getElementById('portrait').innerHTML=llamaSVG(l);
  lastFocus=document.activeElement;
  modal.classList.add('open');
  document.getElementById('close').focus();
}
function hearts(el){
  const r=el.getBoundingClientRect();
  for(let i=0;i<5;i++){
    const h=document.createElement('span'); h.className='heart'; h.textContent=['💛','🧡','💚','🤎'][i%4];
    h.style.left=(r.left+r.width*rand(.3,.8))+'px'; h.style.top=(r.top+r.height*rand(0,.3))+'px';
    h.style.animationDelay=(i*.08)+'s'; document.body.appendChild(h);
    setTimeout(()=>h.remove(),1500);
  }
}
function open(s){
  current=s; s.paused=true; s.mode='idle'; s.t=4;
  s.el.classList.remove('walking'); s.el.classList.add('idle');
  s.el.classList.remove('hop'); void s.el.offsetWidth; s.el.classList.add('hop');
  hearts(s.el);
  const c={...s.l.card};
  c.kicker = `${s.l.emoji} ${s.l.name} · ${c.kicker}`;
  setTimeout(()=>showCard(c,s.l),350);
}
function close(){
  modal.classList.remove('open');
  if(current){ current.paused=false; current.el.classList.remove('hop'); current=null; }
  if(lastFocus) lastFocus.focus();
}
document.getElementById('close').addEventListener('click',close);
modal.addEventListener('click',e=>{ if(e.target===modal) close(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && modal.classList.contains('open')) close(); });

document.getElementById('barn').addEventListener('click',()=>showCard(EDUCATION,{wool:'#f3e6cf',emoji:'🎓'}));
document.getElementById('mailbox').addEventListener('click',()=>showCard(CONTACT,{wool:'#e8c9a0',emoji:'📬'}));

/* ---------- day / night ---------- */
const toggle=document.getElementById('toggle');
function setNight(on){ document.body.classList.toggle('night',on); toggle.textContent=on?'☀️':'🌙'; }
try{ if(matchMedia('(prefers-color-scheme: dark)').matches) setNight(true); }catch(e){}
toggle.addEventListener('click',()=>setNight(!document.body.classList.contains('night')));
document.getElementById('sun').addEventListener('click',()=>setNight(!document.body.classList.contains('night')));
</script>
